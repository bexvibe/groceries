<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Weekly Grocery Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --page: #F2F2F2;
    --surface: #FFFFFF;
    --line: #DCDCDC;
    --accent-soft: #E7E7E7;
    --ink-soft: #6E6E6E;
    --accent: #1A1A1A;
    --ink: #121212;

    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-ms: 260ms;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --ease-ms: 0ms; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: calc(16px + env(safe-area-inset-top)) 20px 0;
    position: sticky;
    top: 0;
    background: var(--page);
    z-index: 5;
  }
  .progress-bar {
    height: 4px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width var(--ease-ms) var(--ease);
    width: 0%;
  }
  .header-row {
    padding: 12px 2px 16px;
  }
  .step-label {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  main {
    flex: 1;
    padding: 4px 20px calc(100px + env(safe-area-inset-bottom));
  }
  h1.cat-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 400;
    font-size: clamp(25px, 7.18vw, 31px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  p.cat-subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .cat-note {
    border-left: 2px solid var(--line);
    padding-left: 12px;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 20px;
    max-width: 60ch;
  }
  .chips-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    transition: background var(--ease-ms) var(--ease), border-color var(--ease-ms) var(--ease), color var(--ease-ms) var(--ease);
  }
  .chip.selected {
    border-color: transparent;
    background: var(--accent-soft);
    color: var(--ink);
  }
  .chip-name {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: inherit;
    cursor: pointer;
    line-height: 1.35;
  }
  .chip-note {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .qty-row {
    flex: none;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .qty-btn {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: background var(--ease-ms) var(--ease), border-color var(--ease-ms) var(--ease);
  }
  .qty-btn svg {
    width: 15px;
    height: 15px;
    display: block;
  }
  .qty-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .qty-btn:active:not(:disabled) {
    background: var(--accent-soft);
  }
  .qty-value {
    min-width: 44px;
    text-align: center;
    font-family: 'Work Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
  }
  footer {
    display: flex;
    gap: 8px;
    padding: 14px 20px calc(20px + env(safe-area-inset-bottom));
    background: var(--surface);
    box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.11);
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    max-width: 640px;
    margin: 0 auto;
    z-index: 10;
  }
  .btn {
    flex: 1;
    min-height: 44px;
    padding: 9px 16px;
    border-radius: 6px;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--page);
    cursor: pointer;
  }
  .btn-secondary {
    background: transparent;
    border-color: var(--line);
    color: var(--ink);
  }
  .btn-secondary:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .btn-primary:active {
    opacity: 0.85;
  }
  .review-textarea {
    width: 100%;
    min-height: 360px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.6;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    resize: vertical;
    color: var(--ink);
  }
  .review-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .review-actions .btn {
    flex: none;
    padding: 9px 16px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="header-row">
      <span class="step-label" id="stepLabel"></span>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    <button id="backBtn" class="btn btn-secondary">Back</button>
    <button id="nextBtn" class="btn btn-primary">Next</button>
  </footer>
</div>

<script>
const CATEGORIES = [
  { name: "Baby & Child", items: [

  ]},

    { name: "Frozen blueberries", qty: 1, unit: "ea" },

    { name: "Fresh Tomatoes Loose", short: "Tomatoes", qty: 4, unit: "ea" },
    { name: "Fresh Vegetable Cucumbers Lebanese", short: "Cucumbers", qty: 2, unit: "ea" },
    { name: "Fresh Vegetable Red Onions Peeled", short: "Red onions", qty: 2, unit: "ea" },
    { name: "Woolworths Mushrooms White Button", short: "Mushrooms", qty: 1, unit: "ea" },
    { name: "Leek", qty: 1, unit: "ea" },
    { name: "Rocket", qty: 2, unit: "ea" },
    { name: "Spinach", qty: 1, unit: "ea" },
    { name: "Courgette", qty: 4, unit: "ea" },
    { name: "Pumpkin (peeled, no skin)", short: "Pumpkin", qty: 1, unit: "ea" },
    { name: "Spring onion", qty: 1, unit: "ea" },
    { name: "Kumara", qty: 1, unit: "ea" },
    { name: "Carrot", qty: 6, unit: "ea" },
  ]},
  { name: "Meat & Fish", items: [
    { name: "Woolworths Asado Beef Short Ribs (min order 600g)", short: "Beef short ribs", qty: 2, unit: "ea", note: "min order 600g" },
    { name: "Salmon (fresh)", short: "Salmon", qty: 1, unit: "ea", note: "if not already covered by smoked" },

  ]},
  { name: "Household", items: [

    { name: "Stain remover spray", qty: 1, unit: "ea" },
    { name: "Laundry detergent, sensitive/fragrance-free", short: "Laundry detergent", qty: 1, unit: "ea" },
    { name: "Mop", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Condiments & Vinegar", items: [
    { name: "Bragg Apple Cider Vinegar Organic", short: "Apple cider vinegar", qty: 1, unit: "ea" },
    { name: "Dyc White Vinegar", short: "White vinegar", qty: 1, unit: "ea" },
    { name: "White wine (cooking)", short: "Cooking wine", qty: 1, unit: "ea" },
    { name: "Chili oil", qty: 1, unit: "ea" },
    { name: "Woolworths Pizza Sauce Garlic & Basil", short: "Pizza sauce", qty: 1, unit: "ea" },
    { name: "Soy sauce", qty: 1, unit: "ea" },
    { name: "Rice vinegar", qty: 1, unit: "ea" },
    { name: "Sesame oil", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Stock & Broth", items: [

    { name: "Oxo Chicken Stock Cubes 71g", short: "Chicken stock cubes", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Canned & Soup",
    categoryNote: "For canned items (beans, chickpeas, lentils, tomatoes, coconut cream), skip Macro Organic — any standard/Woolworths brand is fine.",
    items: [
      { name: "Woolworths Beans Cannellini", short: "Cannellini beans", qty: 2, unit: "ea" },
      { name: "Essentials Coconut Cream", short: "Coconut cream", qty: 2, unit: "ea" },
      { name: "King Soup Mix Hearty Vegetable Low Salt", short: "Vegetable soup mix", qty: 1, unit: "ea" },
      { name: "Canned lentils", qty: 2, unit: "ea" },
      { name: "Canned chickpeas", qty: 1, unit: "ea" },
      { name: "Canned tomatoes", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Grains & Baking", items: [
    { name: "Scotti Arborio Rice", short: "Arborio rice", qty: 1, unit: "ea" },
    { name: "Diamond Pasta Orzo", short: "Orzo pasta", qty: 1, unit: "ea" },
    { name: "Tio Pablo Corn Tortillas Gluten Free", short: "Corn tortillas", qty: 1, unit: "ea" },
    { name: "Harraways Oats Extra Creamy", short: "Oats", qty: 1, unit: "ea" },
    { name: "Ceres Organics Brown Rice Crackers Original", short: "Rice crackers", qty: 2, unit: "ea" },
    { name: "Woolworths Brown Sugar", short: "Brown sugar", qty: 1, unit: "ea" },
    { name: "Freshlife Chickpea Flour Gluten Free", short: "Chickpea flour", qty: 1, unit: "ea" },
    { name: "Soba noodles", qty: 1, unit: "ea" },
    { name: "Pizza bases", qty: 2, unit: "ea" },
  ]},
  { name: "Pantry — Nut Butters, Seeds & Snacks", items: [
    { name: "Tahini (hulled is fine)", short: "Tahini", qty: 1, unit: "ea" },
    { name: "Macro Hemp Seeds", short: "Hemp seeds", qty: 1, unit: "ea" },
    { name: "Macro LSA Mix Linseed, Sunflower & Almond", short: "LSA mix", qty: 1, unit: "ea" },
    { name: "Macro Organic Coconut Flakes Toasted", short: "Coconut flakes", qty: 1, unit: "ea" },
    { name: "Woolworths Sesame Seeds", short: "Sesame seeds", qty: 1, unit: "ea" },
    { name: "Cinderella Camel Dates Pitted", short: "Dates", qty: 1, unit: "ea" },
    { name: "Whittaker's Chocolate Creamy Milk", short: "Chocolate", qty: 3, unit: "ea" },
    { name: "Peanut butter", qty: 1, unit: "ea" },
    { name: "Wraps", qty: 1, unit: "ea" },
    { name: "Chia seeds", qty: 1, unit: "ea" },
    { name: "Flaxseed", qty: 1, unit: "ea" },
    { name: "Almonds", qty: 1, unit: "ea" },
    { name: "Almond meal", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Spices & Misc", items: [
    { name: "Greggs Cinnamon Ground", short: "Ground cinnamon", qty: 1, unit: "ea" },
  ]},
  { name: "Dairy Alternatives", items: [
    { name: "Sanitarium So Good Oat High Fibre & Prebiotics", short: "Oat milk", qty: 2, unit: "ea" },
  ]},
  { name: "Oils", items: [
    { name: "Woolworths Olive Oil Extra Virgin", short: "Olive oil", qty: 1, unit: "ea" },
    { name: "Coconut oil", qty: 1, unit: "ea" },
  ]},
  { name: "Ceres Organics Sauerkraut", items: [
    { name: "Ceres Organics Sauerkraut", short: "Sauerkraut", qty: 1, unit: "ea" },
  ]},
];

// runtime state lives directly on each item: item.selected, item.qty (starts at defaultQty)
CATEGORIES.forEach(cat => cat.items.forEach(item => {
  item.defaultQty = item.qty;
  item.selected = !!item.always;
}));

const TOTAL_STEPS = CATEGORIES.length + 1; // + review page
let step = 0;

const mainEl = document.getElementById("main");
const progressFill = document.getElementById("progressFill");
const stepLabel = document.getElementById("stepLabel");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

const MINUS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>`;
const PLUS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`;

function qtyStep(unit) {
  return unit === "kg" ? 0.5 : 1;
}

function formatQty(qty, unit) {
  const rounded = Math.round(qty * 100) / 100;
  const qtyStr = rounded % 1 === 0 ? rounded.toString() : rounded.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  return unit === "ea" ? qtyStr : `${qtyStr} ${unit}`;
}

function renderCategoryPage(catIndex) {
  const cat = CATEGORIES[catIndex];
  let html = `<h1 class="cat-title">${cat.name}</h1>`;
  html += `<p class="cat-subtitle">Tap the items you need this week. Use −/+ to adjust quantity.</p>`;
  if (cat.categoryNote) {
    html += `<div class="cat-note">${cat.categoryNote}</div>`;
  }
  html += `<div class="chips-grid">`;
  cat.items.forEach((item, idx) => {
    const step = qtyStep(item.unit);
    const min = step;
    html += `
      <div class="chip ${item.selected ? "selected" : ""}">
        <button type="button" class="chip-name" data-action="toggle" data-cat="${catIndex}" data-idx="${idx}">
          ${item.short || item.name}
          ${item.note ? `<span class="chip-note">${item.note}</span>` : ""}
        </button>
        ${item.selected ? `
          <div class="qty-row">
            <button type="button" class="qty-btn" data-action="dec" data-cat="${catIndex}" data-idx="${idx}" ${item.qty <= min ? "disabled" : ""} aria-label="Decrease quantity">${MINUS_ICON}</button>
            <span class="qty-value">${formatQty(item.qty, item.unit)}</span>
            <button type="button" class="qty-btn" data-action="inc" data-cat="${catIndex}" data-idx="${idx}" aria-label="Increase quantity">${PLUS_ICON}</button>
          </div>
        ` : ""}
      </div>
    `;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
}

const AI_SHOPPER_INSTRUCTIONS = `I need you to do a grocery shop for me on Woolworths NZ, delivering to my local store in Gisborne, New Zealand. Please schedule the soonest available delivery slot. Where an item has multiple options, prioritise the healthiest version (e.g. less added sugar, fewer additives, wholegrain over refined, organic where reasonably priced). I will do a final review of the cart and complete the purchase myself — please don't finalise payment.

One shopping rule to apply throughout: for any canned items (beans, chickpeas, lentils, tomatoes, coconut cream), skip Macro Organic brand specifically — the price premium isn't worth it, so any standard or Woolworths house brand is fine.`;

function buildOutputText() {
  const lines = [];
  lines.push(AI_SHOPPER_INSTRUCTIONS);
  lines.push("");
  lines.push(`Here's this week's list (generated ${new Date().toLocaleDateString()}):`);

  CATEGORIES.forEach(cat => {
    const picked = cat.items.filter(i => i.selected);
    if (!picked.length) return;
    lines.push("");
    lines.push(`${cat.name}:`);
    picked.forEach(item => {
      const qtyStr = formatQty(item.qty, item.unit);
      const noteStr = item.note ? ` (${item.note})` : "";
      lines.push(`- ${item.short || item.name} x${qtyStr}${noteStr}`);
    });
  });

  const anySelected = CATEGORIES.some(c => c.items.some(i => i.selected));
  if (!anySelected) {
    lines.push("");
    lines.push("(No items selected.)");
  }
  return lines.join("\n");
}

function renderReviewPage() {
  const text = buildOutputText();
  mainEl.innerHTML = `
    <h1 class="cat-title">Your list is ready</h1>
    <p class="cat-subtitle">Copy this and hand it to your shopping assistant.</p>
    <textarea class="review-textarea" id="reviewText" readonly>${text.replace(/</g, "&lt;")}</textarea>
    <div class="review-actions">
      <button type="button" class="btn btn-primary" id="copyBtn">Copy list</button>
      <button type="button" class="btn btn-secondary" id="resetBtn">Start over</button>
    </div>
  `;
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const textarea = document.getElementById("reviewText");
    try {
      await navigator.clipboard.writeText(textarea.value);
    } catch (e) {
      textarea.select();
      document.execCommand("copy");
    }
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    CATEGORIES.forEach(cat => cat.items.forEach(item => {
      item.selected = !!item.always;
      item.qty = item.defaultQty;
    }));
    step = 0;
    render();
  });
}

function updateHeader() {
  progressFill.style.width = `${(step / (TOTAL_STEPS - 1)) * 100}%`;
  if (step < CATEGORIES.length) {
    stepLabel.textContent = `Step ${step + 1} of ${CATEGORIES.length} · ${CATEGORIES[step].name}`;
  } else {
    stepLabel.textContent = `Review`;
  }
}

function updateFooter() {
  backBtn.disabled = step === 0;
  if (step === CATEGORIES.length) {
    nextBtn.style.display = "none";
  } else {
    nextBtn.style.display = "block";
    nextBtn.textContent = step === CATEGORIES.length - 1 ? "Finish" : "Next";
  }
}

function render() {
  updateHeader();
  updateFooter();
  if (step < CATEGORIES.length) {
    renderCategoryPage(step);
  } else {
    renderReviewPage();
  }
  window.scrollTo(0, 0);
}

mainEl.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const catIndex = Number(el.dataset.cat);
  const idx = Number(el.dataset.idx);
  const item = CATEGORIES[catIndex].items[idx];
  const step_ = qtyStep(item.unit);
  const min = step_;

  if (el.dataset.action === "toggle") {
    item.selected = !item.selected;
    if (item.selected) item.qty = item.defaultQty;
  } else if (el.dataset.action === "inc") {
    item.qty = Math.round((item.qty + step_) * 100) / 100;
  } else if (el.dataset.action === "dec") {
    item.qty = Math.max(min, Math.round((item.qty - step_) * 100) / 100);
  }
  renderCategoryPage(catIndex);
});

backBtn.addEventListener("click", () => {
  if (step > 0) {
    step -= 1;
    render();
  }
});

nextBtn.addEventListener("click", () => {
  if (step < TOTAL_STEPS - 1) {
    step += 1;
    render();
  }
});

render();
</script>
</body>
</html>
