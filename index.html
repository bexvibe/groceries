<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Grocery Picker</title>
<style>
  :root {
    --bg: #f6f7f5;
    --card-bg: #ffffff;
    --accent: #2f9e58;
    --accent-light: #eaf7ef;
    --accent-dark: #237a44;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e3e6e1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px 0;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 5;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease;
    width: 0%;
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 2px 14px;
  }
  .step-label {
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  main {
    flex: 1;
    padding: 4px 20px 24px;
  }
  h1.cat-title {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }
  p.cat-subtitle {
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 16px;
  }
  .cat-note {
    background: #fff7e6;
    border: 1px solid #f3dfa8;
    color: #7a5a12;
    font-size: 0.85rem;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .chips-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chip {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .chip.selected {
    background: var(--accent-light);
    border-color: var(--accent);
  }
  .chip-name {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chip-title {
    font-size: 0.94rem;
    font-weight: 500;
    line-height: 1.3;
  }
  .chip.selected .chip-title {
    color: var(--accent-dark);
    font-weight: 600;
  }
  .chip-note {
    font-size: 0.74rem;
    color: var(--muted);
    font-style: italic;
  }
  .qty-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .qty-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: #fff;
    color: var(--accent-dark);
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qty-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .qty-btn:active:not(:disabled) {
    background: var(--accent-light);
  }
  .qty-value {
    min-width: 46px;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text);
  }
  footer {
    display: flex;
    gap: 12px;
    padding: 14px 20px 22px;
    background: var(--bg);
    border-top: 1px solid var(--border);
  }
  .btn {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
  }
  .btn-secondary {
    background: #fff;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn-primary:active {
    background: var(--accent-dark);
  }
  .review-textarea {
    width: 100%;
    min-height: 360px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 0.86rem;
    line-height: 1.5;
    padding: 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fff;
    resize: vertical;
    color: var(--text);
  }
  .review-actions {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }
  .review-actions .btn {
    flex: none;
    padding: 10px 16px;
    font-size: 0.9rem;
  }
  .empty-note {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
    padding: 40px 10px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="header-row">
      <span class="step-label" id="stepLabel"></span>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    <button id="backBtn" class="btn btn-secondary">Back</button>
    <button id="nextBtn" class="btn btn-primary">Next</button>
  </footer>
</div>

<script>
const CATEGORIES = [

  ]},
  { name: "Frozen", items: [

    { name: "Frozen blueberries", qty: 1, unit: "ea" },
    { name: "Frozen peas", qty: 1, unit: "ea" },
    { name: "Edamame (shelled, frozen)", qty: 1, unit: "ea" },
    { name: "Frozen crumbed fish", qty: 1, unit: "ea" },
  ]},
  { name: "Fruit & Veg", items: [
    { name: "Fresh Fruit Bananas Yellow Loose", qty: 2, unit: "kg" },
    { name: "Fresh Fruit Lemon Everyday Loose", qty: 2, unit: "kg" },
    { name: "Fresh Tomatoes Loose", qty: 4, unit: "ea" },
    { name: "Fresh Vegetable Cucumbers Lebanese", qty: 2, unit: "ea" },
    { name: "Fresh Vegetable Red Onions Peeled", qty: 2, unit: "ea" },
    { name: "Woolworths Mushrooms White Button", qty: 1, unit: "ea" },
    { name: "Leek", qty: 1, unit: "ea" },
    { name: "Rocket", qty: 2, unit: "ea" },
    { name: "Spinach", qty: 1, unit: "ea" },
    { name: "Zucchini", qty: 4, unit: "ea" },
    { name: "Pumpkin (peeled, no skin)", qty: 1, unit: "ea" },
    { name: "Spring onion", qty: 1, unit: "ea" },
    { name: "Kumara", qty: 1, unit: "ea" },
    { name: "Carrot", qty: 6, unit: "ea" },
  ]},
  { name: "Meat & Fish", items: [
    { name: "Woolworths Asado Beef Short Ribs (min order 600g)", qty: 2, unit: "ea" },
    { name: "Salmon (fresh)", qty: 1, unit: "ea", note: "if not already covered by smoked" },
    { name: "Canned tuna (Woolworths Tuna In Spring Water)", qty: 3, unit: "ea" },
  ]},
  { name: "Household", items: [
    { name: "Essentials Toilet Paper 12pk White 2ply", qty: 1, unit: "ea" },
    { name: "Stain remover spray", qty: 1, unit: "ea" },
    { name: "Laundry detergent, sensitive/fragrance-free", qty: 1, unit: "ea", note: "needed next week" },
    { name: "Mop", qty: 1, unit: "ea", note: "needed next week" },
  ]},
  { name: "Pantry — Condiments & Vinegar", items: [
    { name: "Bragg Apple Cider Vinegar Organic", qty: 1, unit: "ea", note: "needed next shop" },
    { name: "Dyc White Vinegar", qty: 1, unit: "ea" },
    { name: "White wine (cooking)", qty: 1, unit: "ea" },
    { name: "Chili oil", qty: 1, unit: "ea", note: "needed next shop" },
    { name: "Woolworths Pizza Sauce Garlic & Basil", qty: 1, unit: "ea" },
    { name: "Soy sauce", qty: 1, unit: "ea" },
    { name: "Rice vinegar", qty: 1, unit: "ea" },
    { name: "Sesame oil", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Stock & Broth", items: [
    { name: "Campbells Real Stock Beef Stock Liquid", qty: 1, unit: "ea" },
    { name: "Oxo Chicken Stock Cubes 71g", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Canned & Soup",
    categoryNote: "For canned items (beans, chickpeas, lentils, tomatoes, coconut cream), skip Macro Organic — any standard/Woolworths brand is fine.",
    items: [
      { name: "Woolworths Beans Cannellini", qty: 2, unit: "ea" },
      { name: "Essentials Coconut Cream", qty: 2, unit: "ea" },
      { name: "King Soup Mix Hearty Vegetable Low Salt", qty: 1, unit: "ea" },
      { name: "Canned lentils", qty: 2, unit: "ea" },
      { name: "Canned chickpeas", qty: 1, unit: "ea" },
      { name: "Canned tomatoes", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Grains & Baking", items: [
    { name: "Scotti Arborio Rice", qty: 1, unit: "ea" },
    { name: "Diamond Pasta Orzo", qty: 1, unit: "ea" },
    { name: "Tio Pablo Corn Tortillas Gluten Free", qty: 1, unit: "ea" },
    { name: "Harraways Oats Extra Creamy", qty: 1, unit: "ea" },
    { name: "Ceres Organics Brown Rice Crackers Original", qty: 1, unit: "ea" },
    { name: "Woolworths Brown Sugar", qty: 1, unit: "ea" },
    { name: "Freshlife Chickpea Flour Gluten Free", qty: 1, unit: "ea" },
    { name: "Soba noodles", qty: 1, unit: "ea" },
    { name: "Pizza bases", qty: 2, unit: "ea" },
  ]},
  { name: "Pantry — Nut Butters, Seeds & Snacks", items: [
    { name: "Tahini (hulled is fine)", qty: 1, unit: "ea" },
    { name: "Macro Hemp Seeds", qty: 1, unit: "ea" },
    { name: "Macro LSA Mix Linseed, Sunflower & Almond", qty: 1, unit: "ea" },
    { name: "Macro Organic Coconut Flakes Toasted", qty: 1, unit: "ea" },
    { name: "Woolworths Sesame Seeds", qty: 1, unit: "ea" },
    { name: "Cinderella Camel Dates Pitted", qty: 1, unit: "ea" },
    { name: "Whittaker's Chocolate Creamy Milk", qty: 3, unit: "ea" },
    { name: "Peanut butter", qty: 1, unit: "ea", note: "needed next shop" },
    { name: "Wraps", qty: 1, unit: "ea", note: "needed next shop" },
    { name: "Chia seeds", qty: 1, unit: "ea" },
    { name: "Flaxseed", qty: 1, unit: "ea" },
    { name: "Almonds", qty: 1, unit: "ea" },
    { name: "Almond meal", qty: 1, unit: "ea" },
  ]},
  { name: "Pantry — Spices & Misc", items: [
    { name: "Greggs Cinnamon Ground", qty: 1, unit: "ea" },
  ]},
  { name: "Dairy Alternatives", items: [
    { name: "Sanitarium So Good Oat High Fibre & Prebiotics", qty: 2, unit: "ea" },
  ]},
  { name: "Oils", items: [
    { name: "Woolworths Olive Oil Extra Virgin", qty: 1, unit: "ea" },
    { name: "Coconut oil", qty: 1, unit: "ea", note: "needed next shop" },
  ]},
  { name: "Ceres Organics Sauerkraut", items: [
    { name: "Ceres Organics Sauerkraut", qty: 1, unit: "ea" },
  ]},
];

// runtime state lives directly on each item: item.selected, item.qty (starts at defaultQty)
CATEGORIES.forEach(cat => cat.items.forEach(item => {
  item.defaultQty = item.qty;
  item.selected = false;
}));

const TOTAL_STEPS = CATEGORIES.length + 1; // + review page
let step = 0;

const mainEl = document.getElementById("main");
const progressFill = document.getElementById("progressFill");
const stepLabel = document.getElementById("stepLabel");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

function qtyStep(unit) {
  return unit === "kg" ? 0.5 : 1;
}

function formatQty(qty, unit) {
  const rounded = Math.round(qty * 100) / 100;
  const qtyStr = rounded % 1 === 0 ? rounded.toString() : rounded.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
  return unit === "ea" ? qtyStr : `${qtyStr} ${unit}`;
}

function renderCategoryPage(catIndex) {
  const cat = CATEGORIES[catIndex];
  let html = `<h1 class="cat-title">${cat.name}</h1>`;
  html += `<p class="cat-subtitle">Tap the items you need this week. Use −/+ to adjust quantity.</p>`;
  if (cat.categoryNote) {
    html += `<div class="cat-note">${cat.categoryNote}</div>`;
  }
  html += `<div class="chips-grid">`;
  cat.items.forEach((item, idx) => {
    const step = qtyStep(item.unit);
    const min = step;
    html += `
      <div class="chip ${item.selected ? "selected" : ""}">
        <button type="button" class="chip-name" data-action="toggle" data-cat="${catIndex}" data-idx="${idx}">
          <span class="chip-title">${item.name}</span>
          ${item.note ? `<span class="chip-note">${item.note}</span>` : ""}
        </button>
        ${item.selected ? `
          <div class="qty-row">
            <button type="button" class="qty-btn" data-action="dec" data-cat="${catIndex}" data-idx="${idx}" ${item.qty <= min ? "disabled" : ""}>−</button>
            <span class="qty-value">${formatQty(item.qty, item.unit)}</span>
            <button type="button" class="qty-btn" data-action="inc" data-cat="${catIndex}" data-idx="${idx}">+</button>
          </div>
        ` : ""}
      </div>
    `;
  });
  html += `</div>`;
  mainEl.innerHTML = html;
}

function buildOutputText() {
  const lines = [];
  lines.push("GROCERY SHOPPING LIST");
  lines.push(`Generated: ${new Date().toLocaleDateString()}`);

  const generalNotes = CATEGORIES.filter(c => c.categoryNote && c.items.some(i => i.selected));
  if (generalNotes.length) {
    lines.push("");
    lines.push("Shopping notes:");
    generalNotes.forEach(c => lines.push(`- ${c.categoryNote}`));
  }

  CATEGORIES.forEach(cat => {
    const picked = cat.items.filter(i => i.selected);
    if (!picked.length) return;
    lines.push("");
    lines.push(`${cat.name}:`);
    picked.forEach(item => {
      const qtyStr = formatQty(item.qty, item.unit);
      const noteStr = item.note ? ` (${item.note})` : "";
      lines.push(`- ${item.name} x${qtyStr}${noteStr}`);
    });
  });

  const anySelected = CATEGORIES.some(c => c.items.some(i => i.selected));
  if (!anySelected) {
    lines.push("");
    lines.push("(No items selected.)");
  }
  return lines.join("\n");
}

function renderReviewPage() {
  const text = buildOutputText();
  mainEl.innerHTML = `
    <h1 class="cat-title">Your list is ready</h1>
    <p class="cat-subtitle">Copy this and hand it to your shopping assistant.</p>
    <textarea class="review-textarea" id="reviewText" readonly>${text.replace(/</g, "&lt;")}</textarea>
    <div class="review-actions">
      <button type="button" class="btn btn-primary" id="copyBtn" style="flex:none;">Copy list</button>
      <button type="button" class="btn btn-secondary" id="resetBtn" style="flex:none;">Start over</button>
    </div>
  `;
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const textarea = document.getElementById("reviewText");
    try {
      await navigator.clipboard.writeText(textarea.value);
    } catch (e) {
      textarea.select();
      document.execCommand("copy");
    }
    const btn = document.getElementById("copyBtn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = original; }, 1500);
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    CATEGORIES.forEach(cat => cat.items.forEach(item => {
      item.selected = false;
      item.qty = item.defaultQty;
    }));
    step = 0;
    render();
  });
}

function updateHeader() {
  progressFill.style.width = `${(step / (TOTAL_STEPS - 1)) * 100}%`;
  if (step < CATEGORIES.length) {
    stepLabel.textContent = `Step ${step + 1} of ${CATEGORIES.length} · ${CATEGORIES[step].name}`;
  } else {
    stepLabel.textContent = `Review`;
  }
}

function updateFooter() {
  backBtn.disabled = step === 0;
  if (step === CATEGORIES.length) {
    nextBtn.style.display = "none";
  } else {
    nextBtn.style.display = "block";
    nextBtn.textContent = step === CATEGORIES.length - 1 ? "Finish" : "Next";
  }
}

function render() {
  updateHeader();
  updateFooter();
  if (step < CATEGORIES.length) {
    renderCategoryPage(step);
  } else {
    renderReviewPage();
  }
}

mainEl.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const catIndex = Number(el.dataset.cat);
  const idx = Number(el.dataset.idx);
  const item = CATEGORIES[catIndex].items[idx];
  const step_ = qtyStep(item.unit);
  const min = step_;

  if (el.dataset.action === "toggle") {
    item.selected = !item.selected;
    if (item.selected) item.qty = item.defaultQty;
  } else if (el.dataset.action === "inc") {
    item.qty = Math.round((item.qty + step_) * 100) / 100;
  } else if (el.dataset.action === "dec") {
    item.qty = Math.max(min, Math.round((item.qty - step_) * 100) / 100);
  }
  renderCategoryPage(catIndex);
});

backBtn.addEventListener("click", () => {
  if (step > 0) {
    step -= 1;
    render();
  }
});

nextBtn.addEventListener("click", () => {
  if (step < TOTAL_STEPS - 1) {
    step += 1;
    render();
  }
});

render();
</script>
</body>
</html>
